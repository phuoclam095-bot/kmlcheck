<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Quản Trị Sản Phẩm & Tem QR KML Beauty</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; color: #0f172a; padding: 14px; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 560px; }

    .card { background: #fff; border-radius: 18px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
    .sub { font-size: 13px; color: #64748b; margin-bottom: 16px; }

    .form-group { margin-bottom: 13px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 11px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14.5px; outline: none; background: #fff; }
    input:focus, textarea:focus { border-color: #16a34a; }
    textarea { min-height: 76px; resize: vertical; line-height: 1.45; }

    .input-with-scan { display: flex; gap: 8px; }
    .input-with-scan input { flex: 1; }
    .btn-scan { padding: 0 14px; border: none; border-radius: 10px; background: #0f172a; color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
    .btn-scan:active { opacity: 0.85; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn-submit { width: 100%; padding: 13px; border: none; border-radius: 12px; background: #16a34a; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn-submit:active { background: #15803d; }

    /* Khu vực Upload nhiều ảnh */
    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px; text-align: center; background: #f8fafc; cursor: pointer; transition: 0.2s; }
    .upload-zone:hover { border-color: #16a34a; background: #f0fdf4; }
    .upload-zone p { font-size: 13.5px; color: #334155; font-weight: 600; }
    .upload-zone span { font-size: 12px; color: #64748b; display: block; margin-top: 3px; }

    .img-preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .img-item { position: relative; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; border: 1px solid #e2e8f0; background: #fff; }
    .img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-item .btn-del-img { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(220, 38, 38, 0.9); color: #fff; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .btn-logout { background: #fee2e2; color: #dc2626; border: none; padding: 7px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #e2e8f0; padding: 4px; border-radius: 12px; margin-bottom: 16px; }
    .tab-btn { padding: 10px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; background: transparent; color: #475569; }
    .tab-btn.active { background: #fff; color: #0f172a; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .qr-preview { margin-top: 16px; padding: 16px; border: 1.5px dashed #16a34a; border-radius: 14px; text-align: center; background: #f0fdf4; display: none; }
    .qr-preview img { width: 200px; height: 200px; border-radius: 10px; background: #fff; padding: 8px; border: 1px solid #bbf7d0; }
    .qr-preview p { font-size: 12.5px; color: #166534; margin-top: 8px; word-break: break-all; }

    .cam-modal { position: fixed; inset: 0; background: rgba(15,23,42,0.82); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 999; }
    .cam-modal.show { display: flex; }
    .cam-box { width: 100%; max-width: 400px; background: #fff; border-radius: 18px; padding: 16px; text-align: center; }
    #adminReader { width: 100%; border-radius: 12px; overflow: hidden; margin: 12px 0; }
    .btn-close-cam { width: 100%; padding: 11px; border: none; border-radius: 10px; background: #ef4444; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

<div class="app">
  <!-- ĐĂNG NHẬP -->
  <div id="loginView" class="card">
    <h1>Đăng Nhập Quản Trị</h1>
    <p class="sub">Quản lý sản phẩm & tem xác thực KML Beauty</p>
    <div class="form-group">
      <label>Tài khoản Admin</label>
      <input type="text" id="loginUser" placeholder="Nhập username (VD: admin)" />
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="loginPass" placeholder="Nhập mật khẩu" onkeydown="if(event.key==='Enter') doLogin()" />
    </div>
    <button class="btn-submit" onclick="doLogin()">Đăng nhập hệ thống</button>
  </div>

  <!-- QUẢN TRỊ -->
  <div id="adminView" style="display:none;">
    <div class="card">
      <div class="topbar">
        <div>
          <h1 id="welcomeText">Xin chào, Admin</h1>
          <p class="sub" style="margin-bottom:0;">Thêm mới hoặc cập nhật dữ liệu lên Supabase</p>
        </div>
        <button class="btn-logout" onclick="doLogout()">Đăng xuất</button>
      </div>

      <div class="tabs">
        <button id="tabProd" class="tab-btn active" onclick="switchTab('prod')">1. Sản Phẩm (Mã Vạch)</button>
        <button id="tabQr" class="tab-btn" onclick="switchTab('qr')">2. Tem QR KML Beauty</button>
      </div>

      <!-- TAB 1: THÊM / SỬA SẢN PHẨM MÃ VẠCH -->
      <div id="formProduct">
        <div class="form-group">
          <label>Mã vạch sản phẩm (Barcode) *</label>
          <div class="input-with-scan">
            <input type="text" id="pBarcode" placeholder="VD: 8938546852123" />
            <button type="button" class="btn-scan" onclick="openScanner('pBarcode')">📷 Quét mã</button>
          </div>
        </div>

        <div class="form-group">
          <label>Tên sản phẩm *</label>
          <input type="text" id="pName" placeholder="VD: KML WHITENING BODY CREAM" />
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Giá niêm yết (VNĐ)</label>
            <input type="number" id="pPrice" placeholder="VD: 260000" />
          </div>
          <div class="form-group">
            <label>Khối lượng / Dung tích</label>
            <input type="text" id="pWeight" placeholder="VD: 200 gr" />
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label>Xuất xứ</label>
            <input type="text" id="pOrigin" value="Việt Nam" />
          </div>
          <div class="form-group">
            <label>Đơn vị sở hữu / Phân phối</label>
            <input type="text" id="pBrand" value="KML Beauty" />
          </div>
        </div>

        <!-- CHỌN NHIỀU ẢNH TỪ MÁY TÍNH / ĐIỆN THOẠI HOẶC LINK -->
        <div class="form-group">
          <label>Hình ảnh sản phẩm (Chọn được nhiều ảnh từ máy)</label>
          <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" onchange="handleFilesSelected(event)" />
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <p>🖼️ Bấm để chọn nhiều ảnh từ điện thoại / máy tính</p>
            <span>Hỗ trợ chọn cùng lúc nhiều ảnh (JPG, PNG, WEBP)</span>
          </div>

          <div class="input-with-scan" style="margin-top:8px;">
            <input type="text" id="pImgUrlInput" placeholder="Hoặc dán thêm link ảnh (https://...)" />
            <button type="button" class="btn-scan" onclick="addImageUrl()">+ Thêm link</button>
          </div>

          <div id="imgPreviewGrid" class="img-preview-grid"></div>
        </div>

        <div class="form-group">
          <label>Thành phần</label>
          <textarea id="pIngredients" placeholder="Nhập danh sách thành phần..."></textarea>
        </div>

        <div class="form-group">
          <label>Công dụng</label>
          <textarea id="pUses" placeholder="Nhập công dụng nổi bật..."></textarea>
        </div>

        <div class="form-group">
          <label>Hướng dẫn sử dụng</label>
          <textarea id="pUsage" placeholder="Nhập cách sử dụng..."></textarea>
        </div>

        <div class="form-group">
          <label>Bảo quản</label>
          <textarea id="pStorage" placeholder="VD: Tránh ánh nắng trực tiếp, để nơi khô ráo..."></textarea>
        </div>

        <button id="btnSaveProd" class="btn-submit" onclick="saveProduct()">💾 Lưu Thông Tin Sản Phẩm</button>
      </div>

      <!-- TAB 2: LƯU / SỬA MÃ QR XÁC THỰC CÔNG TY VÀO DATABASE -->
      <div id="formQr" style="display:none;">
        <div class="form-group">
          <label>Mã QR định danh (Lưu vào Database) *</label>
          <div class="input-with-scan">
            <input type="text" id="qCode" value="KML-BEAUTY-AUTH" placeholder="VD: KML-BEAUTY-AUTH" />
            <button type="button" class="btn-scan" onclick="openScanner('qCode')">📷 Quét QR</button>
          </div>
        </div>

        <div class="form-group">
          <label>Tên công ty hiển thị trên Popup *</label>
          <input type="text" id="qCompany" value="Công ty KML Beauty" />
        </div>

        <div class="form-group">
          <label>Website chính thức</label>
          <input type="text" id="qWebsite" value="kmlbeauty.com" />
        </div>

        <div class="form-group">
          <label>Nội dung thông báo xác thực trên Popup</label>
          <textarea id="qNote">Cảm ơn Quý khách đã tin dùng sản phẩm chính hãng của KML Beauty. Quý khách có thể quét tiếp mã vạch sọc trên vỏ hộp để xem thông tin chi tiết từng sản phẩm.</textarea>
        </div>

        <button class="btn-submit" onclick="saveQrCode()">💾 Lưu Mã QR Vào Database & Tạo Ảnh</button>

        <div id="qrPreviewBox" class="qr-preview">
          <img id="qrPreviewImg" src="" alt="Mã QR tĩnh" />
          <p id="qrPreviewLink"></p>
          <a id="qrDownloadBtn" href="" download="QR-KML-Beauty.png" target="_blank" style="display:inline-block; margin-top:10px; padding:9px 16px; background:#0f172a; color:#fff; border-radius:8px; font-size:13px; font-weight:600; text-decoration:none;">⬇️ Tải Ảnh QR Tĩnh Để In Tem</a>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL CAMERA -->
<div id="camModal" class="cam-modal">
  <div class="cam-box">
    <h3 style="font-size:16px;">Đưa mã vạch hoặc QR vào khung</h3>
    <div id="adminReader"></div>
    <button class="btn-close-cam" onclick="closeScanner()">Đóng Camera</button>
  </div>
</div>

<script>
  const ADMIN_WEBHOOK_URL = "https://wsm.congtubaclieu.com.vn/webhook/admin-api";
  const PUBLIC_CHECK_URL  = "https://kmlcheck.vercel.app/";

  let creds = { username: "", password: "" };
  let targetInputId = null;
  let scannerInstance = null;
  let productImages = []; // Mảng lưu nhiều ảnh (Base64 nén hoặc URL)

  window.addEventListener("DOMContentLoaded", () => {
    const saved = sessionStorage.getItem("kml_admin_creds");
    if (saved) {
      creds = JSON.parse(saved);
      doLogin(true);
    }
  });

  // =========================================================================
  // XỬ LÝ CHỌN NHIỀU ẢNH TỪ MÁY & TỰ ĐỘNG NÉN NHẸ ĐỂ LƯU DB MƯỢT
  // =========================================================================
  async function handleFilesSelected(event) {
    const files = Array.from(event.target.files || []);
    if (!files.length) return;

    for (const file of files) {
      if (!file.type.startsWith("image/")) continue;
      const compressedDataUrl = await compressImage(file, 900, 0.78);
      productImages.push(compressedDataUrl);
    }
    event.target.value = "";
    renderImageGrid();
  }

  function compressImage(file, maxWidth = 900, quality = 0.78) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function addImageUrl() {
    const inp = document.getElementById("pImgUrlInput");
    const url = inp.value.trim();
    if (!url) return;
    productImages.push(url);
    inp.value = "";
    renderImageGrid();
  }

  function removeImage(index) {
    productImages.splice(index, 1);
    renderImageGrid();
  }

  function renderImageGrid() {
    const grid = document.getElementById("imgPreviewGrid");
    grid.innerHTML = productImages.map((src, idx) => `
      <div class="img-item">
        <img src="${src}" alt="Ảnh ${idx + 1}" />
        <button type="button" class="btn-del-img" onclick="removeImage(${idx})" title="Xóa ảnh">×</button>
      </div>
    `).join("");
  }

  // =========================================================================
  // API ĐĂNG NHẬP & LƯU DỮ LIỆU
  // =========================================================================
  async function callAdminApi(payload) {
    const res = await fetch(ADMIN_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ...creds, ...payload })
    });
    const data = await res.json();
    return Array.isArray(data) ? data[0] : data;
  }

  async function doLogin(silent = false) {
    if (!silent) {
      creds.username = document.getElementById("loginUser").value.trim();
      creds.password = document.getElementById("loginPass").value;
    }
    if (!creds.username || !creds.password) return alert("Vui lòng nhập đủ tài khoản và mật khẩu!");

    try {
      const res = await callAdminApi({ action: "login" });
      if (res && res.authenticated) {
        sessionStorage.setItem("kml_admin_creds", JSON.stringify(creds));
        document.getElementById("loginView").style.display = "none";
        document.getElementById("adminView").style.display = "block";
        document.getElementById("welcomeText").textContent = "Xin chào, " + (res.full_name || creds.username);
      } else {
        sessionStorage.removeItem("kml_admin_creds");
        if (!silent) alert(res?.message || "Đăng nhập thất bại!");
      }
    } catch (e) {
      alert("Lỗi kết nối n8n Webhook!");
    }
  }

  function doLogout() {
    sessionStorage.removeItem("kml_admin_creds");
    creds = { username: "", password: "" };
    document.getElementById("adminView").style.display = "none";
    document.getElementById("loginView").style.display = "block";
  }

  function switchTab(tab) {
    document.getElementById("tabProd").classList.toggle("active", tab === "prod");
    document.getElementById("tabQr").classList.toggle("active", tab === "qr");
    document.getElementById("formProduct").style.display = tab === "prod" ? "block" : "none";
    document.getElementById("formQr").style.display = tab === "qr" ? "block" : "none";
  }

  async function saveProduct() {
    const barcode = document.getElementById("pBarcode").value.trim();
    const name = document.getElementById("pName").value.trim();
    if (!barcode || !name) return alert("Vui lòng nhập Mã vạch và Tên sản phẩm!");

    const btn = document.getElementById("btnSaveProd");
    btn.disabled = true;
    btn.textContent = "⏳ Đang lưu dữ liệu & hình ảnh...";

    // Lưu mảng ảnh dưới dạng chuỗi JSON (hoặc chuỗi rỗng nếu không có ảnh)
    const imagePayload = productImages.length > 0 ? JSON.stringify(productImages) : "";

    const payload = {
      action: "save_product",
      barcode,
      name,
      price: document.getElementById("pPrice").value.trim(),
      weight: document.getElementById("pWeight").value.trim(),
      origin: document.getElementById("pOrigin").value.trim(),
      brand_owner: document.getElementById("pBrand").value.trim(),
      image_url: imagePayload,
      ingredients: document.getElementById("pIngredients").value.trim(),
      uses: document.getElementById("pUses").value.trim(),
      usage_instructions: document.getElementById("pUsage").value.trim(),
      storage_instructions: document.getElementById("pStorage").value.trim()
    };

    try {
      const res = await callAdminApi(payload);
      alert(res.message);
    } catch (e) {
      alert("Lỗi khi lưu sản phẩm! Kiểm tra kết nối mạng.");
    } finally {
      btn.disabled = false;
      btn.textContent = "💾 Lưu Thông Tin Sản Phẩm";
    }
  }

  async function saveQrCode() {
    const payload = {
      action: "save_qr",
      qr_code: document.getElementById("qCode").value.trim(),
      company_name: document.getElementById("qCompany").value.trim(),
      website: document.getElementById("qWebsite").value.trim(),
      note: document.getElementById("qNote").value.trim()
    };

    if (!payload.qr_code) return alert("Vui lòng nhập Mã QR định danh!");

    try {
      const res = await callAdminApi(payload);
      alert(res.message);

      if (res.authenticated && res.message.includes("thành công")) {
        const fullLink = `${PUBLIC_CHECK_URL}?code=${encodeURIComponent(payload.qr_code)}`;
        const qrImgUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(fullLink)}`;
        document.getElementById("qrPreviewImg").src = qrImgUrl;
        document.getElementById("qrPreviewLink").textContent = fullLink;
        document.getElementById("qrDownloadBtn").href = qrImgUrl;
        document.getElementById("qrPreviewBox").style.display = "block";
      }
    } catch (e) {
      alert("Lỗi khi lưu mã QR!");
    }
  }

  async function openScanner(inputId) {
    targetInputId = inputId;
    document.getElementById("camModal").classList.add("show");
    scannerInstance = new Html5Qrcode("adminReader");

    try {
      await scannerInstance.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: { width: 250, height: 150 },
          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE,
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.UPC_A
          ]
        },
        (decodedText) => {
          let cleanVal = decodedText.trim();
          try {
            if (cleanVal.startsWith("http")) {
              const u = new URL(cleanVal);
              cleanVal = u.searchParams.get("code") || u.searchParams.get("id") || cleanVal;
            }
          } catch (e) {}

          if (targetInputId) {
            document.getElementById(targetInputId).value = cleanVal;
          }
          closeScanner();
        }
      );
    } catch (err) {
      closeScanner();
      alert("Không mở được camera. Vui lòng cấp quyền Camera và chạy qua HTTPS.");
    }
  }

  async function closeScanner() {
    if (scannerInstance) {
      try { await scannerInstance.stop(); } catch (e) {}
      scannerInstance = null;
    }
    document.getElementById("camModal").classList.remove("show");
  }
</script>
</body>
</html>
