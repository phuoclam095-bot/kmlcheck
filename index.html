<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Xác Thực Hàng Chính Hãng - KML Beauty</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    }
    
    .container { width: 100%; max-width: 460px; background: #fff; border-radius: 22px; padding: 24px 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.07); text-align: center; }
    .header { text-align: center; margin-bottom: 18px; }
    .brand-tag { display: inline-block; background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 99px; margin-bottom: 8px; }
    .header h1 { font-size: 21px; font-weight: 800; color: #0f172a; line-height: 1.3; }
    .header p { font-size: 13.5px; color: #64748b; margin-top: 5px; line-height: 1.4; }

    /* Hộp hướng dẫn gọn trước khi bật camera */
    .scan-intro-box { background: #f8fafc; border: 1.5px dashed #cbd5e1; border-radius: 14px; padding: 20px 16px; text-align: center; color: #475569; font-size: 13.5px; line-height: 1.5; }
    .scan-intro-icon { font-size: 32px; margin-bottom: 6px; display: block; }

    /* Khung Camera ẩn mặc định, chỉ hiện khi bấm mở */
    .scanner-box { width: 100%; border-radius: 14px; overflow: hidden; background: #0f172a; position: relative; display: none; margin-bottom: 4px; }
    .scanner-box.active { display: block; }
    #reader { width: 100%; }

    .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 12px; background: #16a34a; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-primary:active { transform: scale(0.98); background: #15803d; }
    .btn-stop { background: #ef4444; }

    .manual-box { margin-top: 18px; padding-top: 16px; border-top: 1px dashed #e2e8f0; text-align: center; }
    .manual-box label { display: block; font-size: 13px; color: #475569; margin-bottom: 8px; font-weight: 500; }
    .input-group { display: flex; gap: 8px; }
    .input-group input { flex: 1; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; text-align: center; }
    .input-group input:focus { border-color: #16a34a; }
    .input-group button { padding: 0 18px; border: none; border-radius: 10px; background: #0f172a; color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }

    .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.88); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; font-weight: 600; color: #16a34a; gap: 10px; text-align: center; }
    .loading-overlay.show { display: flex; }
    .spinner { width: 38px; height: 38px; border: 4px solid #dcfce7; border-top-color: #16a34a; border-radius: 50%; animation: spin 0.8s linear infinite; }

    /* POPUP KẾT QUẢ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 999; animation: fadeIn 0.2s ease; }
    @media (min-width: 500px) { .modal-overlay { align-items: center; padding: 16px; } }
    .modal-overlay.show { display: flex; }

    .modal-card { width: 100%; max-width: 460px; max-height: 92vh; background: #fff; border-radius: 22px 22px 0 0; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.3); animation: slideUp 0.25s ease; text-align: left; }
    @media (min-width: 500px) { .modal-card { border-radius: 22px; } }

    .modal-scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }

    .status-banner { padding: 22px 18px; text-align: center; color: #fff; }
    .status-valid { background: linear-gradient(135deg, #16a34a, #15803d); }
    .status-invalid { background: linear-gradient(135deg, #dc2626, #b91c1c); }

    .shield-icon { width: 58px; height: 58px; margin: 0 auto 10px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.2); padding: 5px 14px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 8px; }
    .status-banner h2 { font-size: 19px; font-weight: 800; text-transform: uppercase; line-height: 1.3; }
    .status-banner p { font-size: 13.5px; opacity: 0.95; margin-top: 6px; line-height: 1.45; }

    .gallery-wrap { position: relative; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .gallery-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .gallery-track::-webkit-scrollbar { display: none; }
    .gallery-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; background: #f8fafc; }
    .gallery-slide img { width: 100%; max-height: 290px; object-fit: contain; display: block; }
    .gallery-dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0; background: #fff; }
    .gallery-dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; transition: 0.2s; }
    .gallery-dot.active { width: 18px; border-radius: 99px; background: #16a34a; }

    .product-body { padding: 18px; }
    .prod-name { font-size: 19px; font-weight: 800; color: #0f172a; line-height: 1.3; text-transform: uppercase; }
    .prod-price-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .prod-price { font-size: 20px; font-weight: 800; color: #16a34a; }
    .prod-origin { font-size: 13px; color: #475569; background: #f1f5f9; padding: 3px 10px; border-radius: 6px; font-weight: 500; }

    .meta-box { margin-top: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 13px; display: flex; flex-direction: column; gap: 9px; font-size: 13.5px; }
    .meta-row { display: flex; justify-content: space-between; gap: 12px; }
    .meta-label { color: #64748b; }
    .meta-val { font-weight: 600; color: #0f172a; text-align: right; }

    .auth-note-box { margin-top: 14px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 13px; font-size: 13.5px; color: #166534; line-height: 1.55; }

    .detail-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid #f1f5f9; }
    .detail-section h3 { font-size: 14px; font-weight: 700; color: #0f172a; text-transform: uppercase; margin-bottom: 6px; }
    .detail-section p { font-size: 14px; color: #334155; line-height: 1.55; white-space: pre-line; }

    .modal-footer { padding: 12px 18px 18px; background: #fff; border-top: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 8px; }
    .btn-scan-barcode { width: 100%; padding: 13px; border: none; border-radius: 12px; background: #16a34a; color: #fff; font-weight: 700; font-size: 14.5px; cursor: pointer; }
    .btn-close-modal { width: 100%; padding: 12px; border: none; border-radius: 12px; background: #f1f5f9; color: #0f172a; font-weight: 600; font-size: 14.5px; cursor: pointer; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="brand-tag">✓ KML BEAUTY OFFICIAL</div>
      <h1>Xác Thực & Tra Cứu Sản Phẩm</h1>
      <p>Quét mã QR chống hàng giả hoặc mã vạch trên bao bì</p>
    </div>

    <!-- Hộp hướng dẫn gọn (hiển thị khi chưa bật camera) -->
    <div id="scanIntroBox" class="scan-intro-box">
      <span class="scan-intro-icon">📷</span>
      Bấm nút bên dưới để bật camera quét <strong>mã QR xác thực</strong> hoặc <strong>mã vạch sọc</strong> trên vỏ hộp sản phẩm
    </div>

    <!-- Khung Camera (ẩn mặc định, chỉ mở khi bấm nút) -->
    <div id="scannerBox" class="scanner-box">
      <div id="reader"></div>
    </div>

    <button id="btnToggleCam" class="btn-primary" onclick="toggleCamera()">
      📷 Mở Camera Quét QR / Mã Vạch
    </button>

    <div class="manual-box">
      <label for="manualCode">Hoặc nhập mã số dưới mã vạch / tem QR:</label>
      <div class="input-group">
        <input type="text" id="manualCode" placeholder="VD: 8938546852123" onkeydown="if(event.key==='Enter') checkManualCode()" />
        <button onclick="checkManualCode()">Kiểm tra</button>
      </div>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="spinner"></div>
    <div>Đang xác thực trên hệ thống KML Beauty...</div>
  </div>

  <div id="resultModal" class="modal-overlay" onclick="closeModalOnBg(event)">
    <div class="modal-card">
      <div class="modal-scroll">
        <div id="statusBanner" class="status-banner status-valid">
          <div id="shieldIcon" class="shield-icon">🛡️</div>
          <div id="statusBadge" class="status-badge">XÁC THỰC CHÍNH HÃNG</div>
          <h2 id="statusTitle">SẢN PHẨM CHÍNH HÃNG</h2>
          <p id="statusSub"></p>
        </div>

        <div id="prodGallery" class="gallery-wrap" style="display:none;">
          <div id="galleryTrack" class="gallery-track"></div>
          <div id="galleryDots" class="gallery-dots"></div>
        </div>

        <div class="product-body">
          <div id="prodName" class="prod-name"></div>
          <div id="prodPriceRow" class="prod-price-row">
            <span id="prodPrice" class="prod-price"></span>
            <span id="prodOrigin" class="prod-origin"></span>
          </div>

          <div id="metaBox" class="meta-box"></div>
          <div id="authNoteBox" class="auth-note-box" style="display:none;"></div>
          <div id="detailsContainer"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btnQuickScanBarcode" class="btn-scan-barcode" style="display:none;" onclick="closeAndStartScan()">
          📷 Quét tiếp mã vạch trên hộp để xem chi tiết
        </button>
        <button class="btn-close-modal" onclick="closeModal()">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    const N8N_WEBHOOK_URL = "https://wsm.congtubaclieu.com.vn/webhook/check-product";

    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const codeFromUrl = params.get("code") || params.get("id") || params.get("barcode");
      if (codeFromUrl && codeFromUrl.trim()) {
        verifyCode(codeFromUrl.trim());
      }
    });

    let html5QrCode = null;
    let isScanning = false;

    async function toggleCamera() {
      const btn = document.getElementById("btnToggleCam");
      const introBox = document.getElementById("scanIntroBox");
      const scannerBox = document.getElementById("scannerBox");

      if (isScanning && html5QrCode) {
        try { await html5QrCode.stop(); } catch (e) {}
        isScanning = false;
        scannerBox.classList.remove("active");
        introBox.style.display = "block";
        btn.innerHTML = "📷 Mở Camera Quét QR / Mã Vạch";
        btn.classList.remove("btn-stop");
        return;
      }

      introBox.style.display = "none";
      scannerBox.classList.add("active");
      html5QrCode = new Html5Qrcode("reader");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          {
            fps: 12,
            qrbox: { width: 240, height: 200 },
            formatsToSupport: [
              Html5QrcodeSupportedFormats.QR_CODE,
              Html5QrcodeSupportedFormats.EAN_13,
              Html5QrcodeSupportedFormats.EAN_8,
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.UPC_A,
              Html5QrcodeSupportedFormats.UPC_E
            ]
          },
          (decodedText) => {
            let extractedCode = decodedText.trim();
            try {
              if (extractedCode.startsWith("http")) {
                const urlObj = new URL(extractedCode);
                extractedCode = urlObj.searchParams.get("code") || urlObj.searchParams.get("id") || extractedCode;
              }
            } catch (e) {}

            toggleCamera();
            verifyCode(extractedCode);
          }
        );

        isScanning = true;
        btn.innerHTML = "⏹ Tắt Camera";
        btn.classList.add("btn-stop");
      } catch (err) {
        scannerBox.classList.remove("active");
        introBox.style.display = "block";
        alert("Không mở được camera. Vui lòng cấp quyền Camera cho trình duyệt.");
      }
    }

    function checkManualCode() {
      const val = document.getElementById("manualCode").value.trim();
      if (!val) return alert("Vui lòng nhập mã số!");
      verifyCode(val);
    }

    async function verifyCode(rawCode) {
      const loader = document.getElementById("loadingOverlay");
      loader.classList.add("show");

      try {
        const response = await fetch(`${N8N_WEBHOOK_URL}?code=${encodeURIComponent(rawCode)}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        if (!response.ok) throw new Error("HTTP " + response.status);
        const resJson = await response.json();
        const item = Array.isArray(resJson) ? resJson[0] : resJson;

        if (item && item.valid && item.data) {
          if (item.scan_type === "company_qr") {
            renderCompanyQrPopup(item.data);
          } else {
            renderValidProduct(item.data, rawCode);
          }
        } else {
          renderInvalidCode(rawCode);
        }
      } catch (err) {
        console.error(err);
        alert("Không thể kết nối máy chủ kiểm tra. Vui lòng thử lại!");
      } finally {
        loader.classList.remove("show");
      }
    }

    function renderCompanyQrPopup(q) {
      const banner = document.getElementById("statusBanner");
      banner.className = "status-banner status-valid";
      document.getElementById("shieldIcon").textContent = "🛡️";
      document.getElementById("statusBadge").textContent = "✓ TEM XÁC THỰC CHÍNH HÃNG";
      document.getElementById("statusTitle").textContent = "HÀNG CHÍNH HÃNG " + (q.company_name || "CÔNG TY KML BEAUTY");
      document.getElementById("statusSub").textContent = "Chứng nhận sản phẩm phân phối chính thức trên hệ thống";

      document.getElementById("prodGallery").style.display = "none";
      document.getElementById("prodName").style.display = "none";
      document.getElementById("prodPriceRow").style.display = "none";
      document.getElementById("detailsContainer").innerHTML = "";

      document.getElementById("metaBox").innerHTML = `
        <div class="meta-row"><span class="meta-label">Đơn vị sở hữu:</span><span class="meta-val">${escapeHtml(q.company_name || "Công ty KML Beauty")}</span></div>
        <div class="meta-row"><span class="meta-label">Mã định danh QR:</span><span class="meta-val">${escapeHtml(q.qr_code)}</span></div>
        <div class="meta-row"><span class="meta-label">Website chính thức:</span><span class="meta-val">${escapeHtml(q.website || "kmlbeauty.com")}</span></div>
        <div class="meta-row"><span class="meta-label">Trạng thái:</span><span class="meta-val" style="color:#16a34a;">✔ Hợp lệ / Chính hãng</span></div>
      `;

      const noteBox = document.getElementById("authNoteBox");
      if (q.note && q.note.trim()) {
        noteBox.style.display = "block";
        noteBox.textContent = q.note;
      } else {
        noteBox.style.display = "none";
      }

      document.getElementById("btnQuickScanBarcode").style.display = "block";
      document.getElementById("resultModal").classList.add("show");
    }

    function renderValidProduct(p, scannedCode) {
      const banner = document.getElementById("statusBanner");
      banner.className = "status-banner status-valid";
      document.getElementById("shieldIcon").textContent = "✅";
      document.getElementById("statusBadge").textContent = "✓ THÔNG TIN SẢN PHẨM CHÍNH HÃNG";
      document.getElementById("statusTitle").textContent = "SẢN PHẨM CHÍNH HÃNG KML BEAUTY";
      document.getElementById("statusSub").textContent = "Thông tin trích xuất từ mã số mã vạch của nhà sản xuất";

      document.getElementById("authNoteBox").style.display = "none";
      document.getElementById("btnQuickScanBarcode").style.display = "none";

      let imgs = [];
      if (p.image_url) {
        try {
          const parsed = JSON.parse(p.image_url);
          imgs = Array.isArray(parsed) ? parsed : [p.image_url];
        } catch (e) {
          imgs = [p.image_url];
        }
      }

      const gallery = document.getElementById("prodGallery");
      const track = document.getElementById("galleryTrack");
      const dots = document.getElementById("galleryDots");

      if (imgs.length > 0) {
        track.innerHTML = imgs.map(src => `<div class="gallery-slide"><img src="${src}" alt="Ảnh sản phẩm" /></div>`).join("");
        dots.innerHTML = imgs.length > 1
          ? imgs.map((_, i) => `<span class="gallery-dot ${i === 0 ? "active" : ""}"></span>`).join("")
          : "";
        track.onscroll = () => {
          const idx = Math.round(track.scrollLeft / track.clientWidth);
          dots.querySelectorAll(".gallery-dot").forEach((d, i) => d.classList.toggle("active", i === idx));
        };
        gallery.style.display = "block";
      } else {
        gallery.style.display = "none";
      }

      document.getElementById("prodName").style.display = "block";
      document.getElementById("prodPriceRow").style.display = "flex";
      document.getElementById("prodName").textContent = p.name || "Sản phẩm KML Beauty";

      const formattedPrice = Number(p.price || 0) > 0
        ? Number(p.price).toLocaleString("vi-VN") + "đ"
        : "Liên hệ";
      document.getElementById("prodPrice").textContent = formattedPrice;
      document.getElementById("prodOrigin").textContent = p.origin || "Việt Nam";

      let metaHtml = `
        <div class="meta-row"><span class="meta-label">Mã vạch sản phẩm:</span><span class="meta-val">${escapeHtml(p.barcode || scannedCode)}</span></div>
        <div class="meta-row"><span class="meta-label">Đơn vị sở hữu:</span><span class="meta-val">${escapeHtml(p.brand_owner || "KML Beauty")}</span></div>
      `;
      if (p.weight) {
        metaHtml += `<div class="meta-row"><span class="meta-label">Khối lượng / Dung tích:</span><span class="meta-val">${escapeHtml(p.weight)}</span></div>`;
      }
      document.getElementById("metaBox").innerHTML = metaHtml;

      const sections = [
        { title: "Thành phần", content: p.ingredients },
        { title: "Công dụng", content: p.uses },
        { title: "Hướng dẫn sử dụng", content: p.usage_instructions },
        { title: "Bảo quản", content: p.storage_instructions }
      ];

      let detailsHtml = "";
      sections.forEach(sec => {
        if (sec.content && sec.content.trim()) {
          detailsHtml += `
            <div class="detail-section">
              <h3>${sec.title}:</h3>
              <p>${escapeHtml(sec.content)}</p>
            </div>
          `;
        }
      });
      document.getElementById("detailsContainer").innerHTML = detailsHtml;

      document.getElementById("resultModal").classList.add("show");
    }

    function renderInvalidCode(scannedCode) {
      const banner = document.getElementById("statusBanner");
      banner.className = "status-banner status-invalid";
      document.getElementById("shieldIcon").textContent = "⚠️";
      document.getElementById("statusBadge").textContent = "CẢNH BÁO XÁC THỰC";
      document.getElementById("statusTitle").textContent = "MÃ KHÔNG TỒN TẠI TRÊN HỆ THỐNG";
      document.getElementById("statusSub").textContent = "Mã QR hoặc mã vạch này không có trên hệ thống của KML Beauty.";

      document.getElementById("prodGallery").style.display = "none";
      document.getElementById("prodName").style.display = "none";
      document.getElementById("prodPriceRow").style.display = "none";
      document.getElementById("authNoteBox").style.display = "none";
      document.getElementById("btnQuickScanBarcode").style.display = "none";
      document.getElementById("detailsContainer").innerHTML = "";

      document.getElementById("metaBox").innerHTML = `
        <div class="meta-row"><span class="meta-label">Mã đã kiểm tra:</span><span class="meta-val" style="color:#dc2626">${escapeHtml(scannedCode)}</span></div>
        <div class="meta-row"><span class="meta-label">Trạng thái:</span><span class="meta-val" style="color:#dc2626">Chưa khai báo hoặc đã bị khóa</span></div>
      `;

      document.getElementById("resultModal").classList.add("show");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function closeAndStartScan() {
      closeModal();
      if (!isScanning) toggleCamera();
    }

    function closeModal() {
      document.getElementById("resultModal").classList.remove("show");
      if (window.history.replaceState && window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    function closeModalOnBg(e) {
      if (e.target.id === "resultModal") closeModal();
    }
  </script>
</body>
</html>
